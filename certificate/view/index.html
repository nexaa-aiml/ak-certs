<!DOCTYPE html>
<html lang="en" data-root="../../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Kshetra 2026 | Certificate View</title>
  <meta name="description" content="View and download your official AI Kshetra 2026 certificate PDF.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23ff007a'>&gt;_</text></svg>">

  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/certificate.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner container">
      <a href="../../index.html" class="terminal-brand">
        <span class="prompt">&gt;_</span> <span class="brand-text">AI_KSHETRA</span>
      </a>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="../../index.html" class="nav-link">[ Home ]</a>        <a href="../../verify/index.html" class="nav-link">[ Verify ]</a>
        <a href="../../about/index.html" class="nav-link">[ About ]</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 3rem;">

    <div id="viewContent">
      <!-- Populated by view.js -->
      <div class="terminal-card" style="text-align:center; padding: 3rem;">
        <div class="terminal-tag">// LOADING...</div>
        <p style="font-family: var(--font-mono); color: var(--primary); margin-top: 1rem;">
          &gt; QUERYING CERTIFICATE REGISTRY...
        </p>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 AI KSHETRA &bull; NEXAA &bull; R.V.R. &amp; J.C. COLLEGE OF ENGINEERING</div>
        <div>TERMINAL_PROTOCOL_VER_3.0</div>
      </div>
    </div>
  </footer>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/crypto.js"></script>
  <script src="../../assets/js/certificate.js"></script>
  <script>
    (function () {
      'use strict';

      function escHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function initView() {
        const viewContent = document.getElementById('viewContent');
        const params = new URLSearchParams(window.location.search);
        const certId = params.get('id');

        if (!certId) {
          viewContent.innerHTML = `
            <div class="terminal-card">
              <div class="terminal-tag">// ERROR / MISSING_PARAMETER</div>
              <h1 class="page-title">&gt;_ NO_CERTIFICATE_ID</h1>
              <p class="subtitle">No certificate ID was provided. Please scan the QR code on your certificate or use the verification portal.</p>
              <div class="action-row" style="margin-top: 1.5rem;">
                <a href="../../verify/index.html" class="btn btn-primary">[ GO TO VERIFY -&gt; ]</a>
                <a href="../../index.html" class="btn btn-outline">[ GET MY CERT ]</a>
              </div>
            </div>`;
          return;
        }

        const res = await window.AI_AUTH.verifyParticipantById(certId);

        if (!res.success || !res.certificate) {
          viewContent.innerHTML = `
            <div class="terminal-card">
              <div class="terminal-tag">// ERROR / CERTIFICATE_NOT_FOUND</div>
              <h1 class="page-title">&gt;_ CERTIFICATE_NOT_FOUND</h1>
              <p class="subtitle">${escHtml(res.error || 'Certificate ID not found in the registry.')}</p>
              <div class="action-row" style="margin-top: 1.5rem;">
                <a href="../../verify/index.html" class="btn btn-outline">[ VERIFY ANOTHER ]</a>
              </div>
            </div>`;
          return;
        }

        const cert = res.certificate;
        document.title = 'AI Kshetra 2026 | ' + cert.certificateType + ' - ' + cert.name;

        viewContent.innerHTML = `
          <div class="terminal-card">
            <div class="corner-marker corner-tl">+</div>
            <div class="corner-marker corner-tr">+</div>
            <div class="corner-marker corner-bl">+</div>
            <div class="corner-marker corner-br">+</div>

            <div class="terminal-tag">// 03 / OFFICIAL_CREDENTIAL_VIEW</div>
            <h1 class="page-title"><span class="prompt">&gt;_</span> CERTIFICATE_VIEW</h1>

            <div class="status-badge authentic-badge" style="margin-bottom: 1.5rem;">
              <span class="icon">[&checkmark;]</span> OFFICIAL AI KSHETRA 2026 CERTIFICATE
            </div>

            <div class="terminal-kv-grid">
              <div class="kv-row">
                <span class="kv-key">NAME:</span>
                <span class="kv-val highlight-val" style="font-size: 1.3rem;">${escHtml(cert.name)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">CERTIFICATE ID:</span>
                <span class="kv-val highlight-val">${escHtml(cert.certificateId)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">EVENT:</span>
                <span class="kv-val" style="font-weight:800;">${escHtml(cert.event)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">TRACK:</span>
                <span class="kv-val">${escHtml(cert.eventTrack || 'AI Kshetra 2026')}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">TYPE:</span>
                <span class="kv-val">${escHtml(cert.certificateType)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">INSTITUTION:</span>
                <span class="kv-val">${escHtml(cert.college)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">DATE:</span>
                <span class="kv-val">${escHtml(cert.date)}</span>
              </div>
              <div class="kv-row">
                <span class="kv-key">ISSUED BY:</span>
                <span class="kv-val">NEXAA &mdash; R.V.R. &amp; J.C. College of Engineering, Guntur</span>
              </div>
            </div>

            <div class="action-row" style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
              <button type="button" class="btn btn-primary" id="btnViewDl">
                [ &darr; DOWNLOAD CERTIFICATE PDF ]
              </button>
              <a href="../../verify/?id=${encodeURIComponent(cert.certificateId)}" class="btn btn-outline">
                [ VERIFY AUTHENTICITY ]
              </a>
              <a href="../../index.html" class="btn btn-dark">
                [ GET ALL MY CERTIFICATES ]
              </a>
            </div>
          </div>
        `;

        const btnDl = document.getElementById('btnViewDl');
        if (btnDl) {
          btnDl.addEventListener('click', () => {
            window.AI_CERT.downloadPdf(cert.certificateId, btnDl);
          });
        }
      }

      document.addEventListener('DOMContentLoaded', initView);
    })();
  </script>
</body>
</html>
